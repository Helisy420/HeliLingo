[workspace]
resolver = "3"
members = ["crates/*", "src-tauri"]

[workspace.package]
version = "2.5.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Helisy420/HeliLingo"

[workspace.dependencies]
hl-core = { path = "crates/hl-core" }
hl-cache = { path = "crates/hl-cache" }
hl-detect = { path = "crates/hl-detect" }
hl-pipeline = { path = "crates/hl-pipeline" }
hl-providers = { path = "crates/hl-providers" }
hl-offline = { path = "crates/hl-offline" }
hl-win = { path = "crates/hl-win" }
hl-docs = { path = "crates/hl-docs" }

tokio = { version = "1.53", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-util = "0.7.20"
futures-util = "0.3"
reqwest = { version = "0.13", default-features = false, features = ["json", "form", "query", "stream", "native-tls", "http2", "gzip", "charset", "system-proxy"] }
eventsource-stream = "0.2.3"
moka = { version = "0.12", features = ["future"] }
redb = "4.4"
lingua = { version = "1.8", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tracing = "0.1.44"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
panic = "abort"
