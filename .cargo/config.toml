# CTranslate2 (offline tiers, via ct2rs) is built with the static MSVC
# runtime; the whole program has to use the same one.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]

[env]
# CMake from the Visual Studio Build Tools; ct2rs needs it. Override with
# your own CMAKE if it lives elsewhere.
CMAKE = { value = 'C:\Program Files (x86)\Microsoft Visual Studio\2022\BuildTools\Common7\IDE\CommonExtensions\Microsoft\CMake\CMake\bin\cmake.exe', force = false }
